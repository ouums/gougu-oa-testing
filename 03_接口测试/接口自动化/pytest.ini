[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --alluredir 放 addopts：每轮自动重建 Allure 结果目录，配 --clean-alluredir 防陈旧结果混入。
# ⚠️ --junitxml **故意不写在这里**：results.xml 是钉住交付周期的原始凭证，
#    只能在定稿那一轮显式加，复跑一律不加（否则时间戳一变，全套周期口径作废）。
addopts = -v -ra --strict-markers --strict-config
          --alluredir=./allure-results --clean-alluredir

# 缺陷被修复后，xfail 用例会 XPASS 并被直接判 FAILED —— xfail 因此成为活的回归探针。
# 这正是用 xfail 而不是 skip 的理由：skip 丢掉失败证据，并掩盖"系统当前是坏的"。
xfail_strict = true

markers =
    qx: 权限体系模块（55 条）
    sp: 审批流模块（35 条）
    ht: 合同管理模块（30 条）
    xz: 薪资管理模块（15 条）
    needs_salary_fixture: 依赖薪资夹具（teststaff/组5/批次 1000~1009），开跑自动重建、跑完自动回收
    needs_flow_fixture: 依赖会签/或签夹具（oa_flow id 20/21），开跑自动重建、跑完自动回收
    known_defect: 已知缺陷的回归用例（xfail），缺陷修复后会 XPASS 判 FAILED
